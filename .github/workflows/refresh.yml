name: Auto-refresh content

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "content/**"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enable GitHub Pages from main (best effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1 && echo "Pages already enabled" || \
          gh api -X POST "repos/${{ github.repository }}/pages" -f "source[branch]=main" -f "source[path]=/" || echo "Enable Pages manually: Settings > Pages > Deploy from branch > main / root"
      - name: Fetch news + videos and rebuild
        run: python3 scripts/refresh.py
      - name: Commit changes
        run: |
          git config user.name "b2b-marketing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Auto-refresh news, videos and sitemap"
          git push
